<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <filter id="laptopShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
    <linearGradient id="metalLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Laptop open/closed base lid shadow -->
  <ellipse cx="350" cy="450" rx="300" ry="18" fill="#0f172a" opacity="0.12" />

  <g filter="url(#laptopShadow)">
    <!-- Base lip shelf -->
    <path d="M 60,420 L 640,420 L 620,440 L 80,440 Z" fill="#94a3b8" />
    <!-- Notch opener -->
    <rect x="320" y="420" width="60" height="6" rx="3" fill="#cbd5e1" />

    <!-- Top Lid Skin Surface -->
    <rect class="pm-mockup-base" x="80" y="60" width="540" height="360" rx="20" 
          fill="var(--mockup-color, #f1f5f9)" stroke="#94a3b8" stroke-width="2" />
    <rect x="80" y="60" width="540" height="360" rx="20" fill="url(#metalLid)" />

    <!-- Sleek border bevel -->
    <rect x="88" y="68" width="524" height="344" rx="14" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    
    <!-- Rubber feet indicator lines -->
    <circle cx="105" cy="85" r="4" fill="#cbd5e1" />
    <circle cx="595" cy="85" r="4" fill="#cbd5e1" />
    <circle cx="105" cy="395" r="4" fill="#cbd5e1" />
    <circle cx="595" cy="395" r="4" fill="#cbd5e1" />
  </g>
</svg>
