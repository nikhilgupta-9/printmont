<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="wrapShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <linearGradient id="ceramicSheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="90%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Flattened panoramic wrap template with subtle top & bottom curved ceramic edges -->
  <g filter="url(#wrapShadow)">
    <rect x="50" y="60" width="700" height="360" rx="12" fill="var(--mockup-color, #ffffff)" stroke="#cbd5e1" stroke-width="2" />
    <rect x="50" y="60" width="700" height="360" rx="12" fill="url(#ceramicSheet)" opacity="0.6" />
    
    <!-- Left handle cut guide -->
    <path d="M 50,200 C 70,220 70,260 50,280" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="2" fill="none" />
    <!-- Right handle cut guide -->
    <path d="M 750,200 C 730,220 730,260 750,280" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="2" fill="none" />

    <!-- Center fold reference indicator -->
    <line x1="400" y1="65" x2="400" y2="415" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.4" />
    <text x="400" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" font-weight="600">Mug Front Center</text>
    <text x="140" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Left Facing</text>
    <text x="660" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Right Facing</text>
  </g>
</svg>
