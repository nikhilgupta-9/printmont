<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <filter id="mugShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
    <linearGradient id="ceramicSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.6"/>
      <stop offset="12%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#e2e8f0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="innerMug" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Ground reflection shadow -->
  <ellipse cx="270" cy="510" rx="190" ry="22" fill="#0f172a" opacity="0.12" />

  <g filter="url(#mugShadow)">
    <!-- Mug Handle -->
    <path d="M 370,190 C 490,190 510,390 370,410 C 445,395 440,210 370,225 Z" 
          fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    <path d="M 370,190 C 490,190 510,390 370,410 C 445,395 440,210 370,225 Z" 
          fill="url(#ceramicSheen)" opacity="0.7" />

    <!-- Mug Cylinder Body -->
    <path class="pm-mockup-base" d="M 140,140 
             L 140,460 
             C 140,495 400,495 400,460 
             L 400,140 Z" 
          fill="var(--mockup-color, #ffffff)" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Ceramic gloss & lighting -->
    <path d="M 140,140 L 140,460 C 140,495 400,495 400,460 L 400,140 Z" 
          fill="url(#ceramicSheen)" />

    <!-- Inside Rim & Opening -->
    <ellipse cx="270" cy="140" rx="130" ry="28" fill="url(#innerMug)" stroke="#cbd5e1" stroke-width="2" />
    <ellipse cx="270" cy="140" rx="122" ry="22" fill="#e2e8f0" />
    <ellipse cx="270" cy="144" rx="114" ry="17" fill="#f8fafc" />

    <!-- Rim highlight ring -->
    <ellipse cx="270" cy="139" rx="129" ry="27" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8" />
  </g>
</svg>
