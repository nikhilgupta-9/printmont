<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <filter id="giftShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <linearGradient id="generalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="530" rx="200" ry="20" fill="#0f172a" opacity="0.1" />

  <g filter="url(#giftShadow)">
    <!-- Universal corporate display stand / box -->
    <rect class="pm-mockup-base" x="90" y="90" width="420" height="420" rx="24" 
          fill="var(--mockup-color, #ffffff)" stroke="#cbd5e1" stroke-width="2" />
    <rect x="90" y="90" width="420" height="420" rx="24" fill="url(#generalGrad)" />

    <!-- Subtle inner bevel frame -->
    <rect x="106" y="106" width="388" height="388" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Corner accent rivets -->
    <circle cx="125" cy="125" r="4" fill="#94a3b8" />
    <circle cx="475" cy="125" r="4" fill="#94a3b8" />
    <circle cx="125" cy="475" r="4" fill="#94a3b8" />
    <circle cx="475" cy="475" r="4" fill="#94a3b8" />
  </g>
</svg>
