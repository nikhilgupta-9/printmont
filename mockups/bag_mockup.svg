<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <filter id="bagShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
    <linearGradient id="canvasTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <g filter="url(#bagShadow)">
    <!-- Canvas Tote Handles -->
    <path d="M 230,260 C 230,60 370,60 370,260" fill="none" stroke="#d6d3d1" stroke-width="26" stroke-linecap="round" />
    <path d="M 230,260 C 230,60 370,60 370,260" fill="none" stroke="#a8a29e" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4" />

    <!-- Bag Main Body -->
    <path class="pm-mockup-base" d="M 140,240 
             L 460,240 
             C 475,240 480,250 485,270 
             L 470,630 
             C 468,645 455,650 440,650 
             L 160,650 
             C 145,650 132,645 130,630 
             L 115,270 
             C 120,250 125,240 140,240 Z" 
          fill="var(--mockup-color, #f5f5f4)" stroke="#d6d3d1" stroke-width="2" />

    <!-- Canvas shading overlay -->
    <path d="M 140,240 L 460,240 C 475,240 480,250 485,270 L 470,630 C 468,645 455,650 440,650 L 160,650 C 145,650 132,645 130,630 L 115,270 C 120,250 125,240 140,240 Z" 
          fill="url(#canvasTexture)" />

    <!-- Top Hem & Seam -->
    <line x1="135" y1="260" x2="465" y2="260" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3" />
    <line x1="135" y1="266" x2="465" y2="266" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="4,3" />

    <!-- Handle Attachment Patches -->
    <rect x="218" y="240" width="24" height="40" rx="3" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1.2" />
    <rect x="358" y="240" width="24" height="40" rx="3" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1.2" />
  </g>
</svg>
