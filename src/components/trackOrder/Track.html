<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Order Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* style.css */
.tracker-container {
    width: 90%;
    max-width: 800px;
    margin: 50px auto;
}

.tracker-bar {
    position: relative;
    /* This height sets the vertical spacing for labels */
    /* height: 100px;  */
    margin-bottom: 30px;
    padding: 0;
}

/* --- Line Styling: Centered and Layered --- */
.line-base, .progress-bar {
    position: absolute;
    height: 4px;
    width: 100%;
    top: 50%; /* Position line in the middle */
    transform: translateY(-50%); /* Center the line vertically */
}

.line-base {
    background-color: #ddd; /* Inactive line color */
    z-index: 1; /* Keep it behind the icons */
}

.progress-bar {
    background-color: #28a745; /* Active line color (e.g., green for progress) */
    width: 0%; 
    z-index: 2; /* Layer above the base line */
    /* *** KEY TRANSITION PROPERTY for smooth growth *** */
    transition: width 0.6s ease-in-out; 
}

/* --- Steps Styling: Positioned over the line --- */
.tracking-steps {
    display: flex;
    justify-content: space-between;
    list-style: none;
    padding: 0;
    margin: 0;
    position: absolute;
    width: 100%;
    top: 50%; /* Align steps to the middle of the bar */
    transform: translateY(-50%); /* Center the steps vertically */
    z-index: 3; /* Keep steps above the lines */
}

.step {
    text-align: center;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* Center the steps visually over the line */
}

.step .icon {
    font-size: 30px;
    color: #aaa; /* Default inactive icon color */
    background-color: #fff; /* White background to "cut" the line at the circle */
    border-radius: 50%;
    padding: 5px;
    margin-bottom: -10px;
    transition: color 0.6s ease, transform 0.3s ease;
}

.step .label {
    color: #6c757d;
    font-size: 14px;
    transition: color 0.6s ease;
    /* margin-top: 20px; */
}

/* --- Active/Completed State --- */
.step.active .icon {
    color: #28a745; /* Active/Done icon color */
    transform: scale(1.1);
}

.step.active .label {
    color: #333; /* Active text color */
    font-weight: bold;
}

/* Button for demonstration */
button {
    padding: 10px 20px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
}
    </style>
</head>
<body>

<div class="tracker-container">
    <div class="tracker-bar" style="border: 1px solid red;">
        <div class="line-base"></div>
        <div class="progress-bar" id="progressBar"></div>
        
        <ul class="tracking-steps" id="trackingSteps">
            <li class="step active" data-step="1">
                <span class="icon"><i class="fas fa-check-circle"></i></span>
                <span class="label">Ordered</span>
            </li>
            <li class="step" data-step="2">
                <span class="icon"><i class="fas fa-check-circle"></i></span>
                <span class="label">Updates</span>
            </li>
            <li class="step" data-step="3">
                <span class="icon"><i class="fas fa-check-circle"></i></span>
                <span class="label">Delivered</span>
            </li>
        </ul>
    </div>
    
    <button onclick="nextStep()" style="margin-top: 20px;">Next Status</button>
</div>

<script>
    // script.js
let currentStep = 1;
const totalSteps = 3;

function updateTracker() {
    const steps = document.querySelectorAll('.step');
    const progressBar = document.getElementById('progressBar');
    
    // 1. Update step classes
    steps.forEach(step => {
        const stepNumber = parseInt(step.getAttribute('data-step'));
        if (stepNumber <= currentStep) {
            step.classList.add('active');
        } else {
            step.classList.remove('active');
        }
    });

    // 2. Calculate and update progress bar width
    // The width calculation remains the same to animate the progress line.
    let progressPercentage = 0;
    if (currentStep > 1) {
        // For 3 steps, 1 segment is 50%, 2 segments is 100%.
        progressPercentage = ((currentStep - 1) / (totalSteps - 1)) * 100;
    }
    
    // Set the width, which triggers the CSS transition: width 0.6s ease-in-out;
    progressBar.style.width = `${progressPercentage}%`;
}

function nextStep() {
    if (currentStep < totalSteps) {
        currentStep++;
    } else {
        // Loop back to the start after the last step
        currentStep = 1; 
    }
    updateTracker();
}

// Initialize the tracker on page load
document.addEventListener('DOMContentLoaded', updateTracker);
</script>

</body>
</html>
